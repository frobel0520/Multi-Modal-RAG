name = "multi-modal-rag"
compatibility_date = "2026-11-20"
pages_build_output_dir = "dist"

[vars]
APP_VERSION = "0.1.0"
DATASET_VERSION = "uninitialized"
DAILY_GLOBAL_QUERY_LIMIT = "250"
DAILY_PER_USER_QUERY_LIMIT = "100"

# Bindings to configure in Cloudflare Pages Dashboard (Settings -> Functions) or uncomment with real IDs:
# [ai]
# binding = "AI"
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<your-kv-namespace-id>"
